name: ETL diario Cloudflare → Supabase

on:
  schedule:
    - cron: "10 07 * * *"   # 07:10 UTC (~01:10 en El Salvador, ajústalo si quieres)
  workflow_dispatch: {}

jobs:
  run-etl:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
      - name: Run ETL
        run: |
          python etl_daily.py
